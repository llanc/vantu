name: CI & Multi-Arch Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build Frontend SPA
        run: |
          pnpm --dir web install --frozen-lockfile --allow-build=esbuild
          pnpm --dir web build
      - name: Run Go Unit & E2E Tests
        run: CGO_ENABLED=0 go test -v ./...
      - name: Build Static Binaries (amd64 & arm64)
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/vantu-linux-amd64 ./cmd/vantu
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bin/vantu-linux-arm64 ./cmd/vantu
